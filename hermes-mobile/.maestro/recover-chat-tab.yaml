# Recover demo Chat after Leash/other tabs.
# Re-arm demo once, prove Hermes React UI is foregrounded, then use the tab bar.
appId: com.iganapolsky.hermesmobile
---
- runFlow: hide-keyboard-safe.yaml
- runFlow: dismiss-mac-picker.yaml
- openLink: "hermes://setup?demo=1&recover=1"
- runFlow:
    when:
      visible:
        text: "Open"
    commands:
      - tapOn:
          text: "Open"
# iOS may keep a system link sheet or another app foregrounded after openLink.
# Preserve the development-client session while bringing Hermes back.
- launchApp:
    stopApp: false
- runFlow: dismiss-print-interruption.yaml
- runFlow: dismiss-mac-picker.yaml
- extendedWaitUntil:
    notVisible:
      id: "tab-screen-loading"
    timeout: 90000
- extendedWaitUntil:
    notVisible:
      id: "connect-mac-gate"
    timeout: 30000
# A negative loading assertion can pass on SpringBoard or the Expo dev-client
# launcher. Require a positive, app-owned tab sentinel before navigating.
- extendedWaitUntil:
    visible:
      id: "tab-hermes"
    timeout: 90000
- tapOn:
    id: "tab-hermes"
- extendedWaitUntil:
    visible:
      id: "chat-screen-header"
    timeout: 90000
- runFlow: hide-keyboard-safe.yaml
- runFlow: dismiss-mac-picker.yaml
# Demo composer can drop after recover — re-arm demo then assert input.
- runFlow:
    when:
      notVisible:
        id: "chat-input"
    commands:
      - openLink: "hermes://setup?demo=1&recover=1"
      - runFlow:
          when:
            visible:
              text: "Open"
          commands:
            - tapOn:
                text: "Open"
      - launchApp:
          stopApp: false
      - extendedWaitUntil:
          visible:
            id: "tab-hermes"
          timeout: 90000
      - tapOn:
          id: "tab-hermes"
      - extendedWaitUntil:
          visible:
            id: "chat-screen-header"
          timeout: 90000
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 90000
