# Recover demo Chat after Leash/other tabs — deep link first, tab bar fallback, assert chat-input.
appId: com.iganapolsky.hermesmobile
---
- runFlow: hide-keyboard-safe.yaml
- runFlow: dismiss-mac-picker.yaml
- openLink: "hermes://chat"
- runFlow:
    when:
      visible:
        text: "Open"
    commands:
      - tapOn:
          text: "Open"
# iOS may keep a system link sheet or another app foregrounded after openLink.
# Preserve Hermes state while bringing the app back before inspecting its tabs.
- launchApp:
    stopApp: false
- runFlow: dismiss-print-interruption.yaml
- runFlow: dismiss-mac-picker.yaml
- extendedWaitUntil:
    notVisible:
      id: "tab-screen-loading"
    timeout: 90000
- extendedWaitUntil:
    notVisible:
      id: "connect-mac-gate"
    timeout: 30000
# If picker re-opened during heal, dismiss again before looking for tabs.
- runFlow: dismiss-mac-picker.yaml
- runFlow:
    when:
      notVisible:
        id: "chat-screen-header"
    commands:
      - runFlow: dismiss-mac-picker.yaml
      - runFlow: hide-keyboard-safe.yaml
      - runFlow:
          when:
            visible:
              id: "tab-hermes"
          commands:
            - tapOn:
                id: "tab-hermes"
- runFlow:
    when:
      notVisible:
        id: "chat-screen-header"
    commands:
      - runFlow: dismiss-mac-picker.yaml
      - openLink: "hermes://setup?demo=1&recover=1"
      - runFlow:
          when:
            visible:
              text: "Open"
          commands:
            - tapOn:
                text: "Open"
      - launchApp:
          stopApp: false
      - extendedWaitUntil:
          notVisible:
            id: "hermes-bootstrap"
          timeout: 30000
      - openLink: "hermes://chat"
      - runFlow:
          when:
            visible:
              text: "Open"
          commands:
            - tapOn:
                text: "Open"
      - launchApp:
          stopApp: false
      - runFlow: dismiss-mac-picker.yaml
# A deep-link event can arrive while React Navigation is remounting and be lost.
# Cold relaunch is the deterministic final fallback: Hermes defaults to Chat and
# demo mode has already been persisted by the setup link above.
- runFlow:
    when:
      notVisible:
        id: "chat-screen-header"
    commands:
      - launchApp
      - extendedWaitUntil:
          notVisible:
            id: "hermes-bootstrap"
          timeout: 90000
      - runFlow: dismiss-print-interruption.yaml
      - runFlow: dismiss-mac-picker.yaml
      - runFlow:
          when:
            visible:
              id: "tab-hermes"
          commands:
            - tapOn:
                id: "tab-hermes"
- extendedWaitUntil:
    visible:
      id: "chat-screen-header"
    timeout: 90000
- runFlow: hide-keyboard-safe.yaml
- runFlow: dismiss-mac-picker.yaml
# Demo composer can drop after recover — re-arm demo then assert input.
- runFlow:
    when:
      notVisible:
        id: "chat-input"
    commands:
      - openLink: "hermes://setup?demo=1&recover=1"
      - runFlow:
          when:
            visible:
              text: "Open"
          commands:
            - tapOn:
                text: "Open"
      - launchApp:
          stopApp: false
      - extendedWaitUntil:
          notVisible:
            id: "hermes-bootstrap"
          timeout: 30000
      - openLink: "hermes://chat"
      - runFlow:
          when:
            visible:
              text: "Open"
          commands:
            - tapOn:
                text: "Open"
      - launchApp:
          stopApp: false
      - runFlow: dismiss-mac-picker.yaml
      - extendedWaitUntil:
          visible:
            id: "chat-screen-header"
          timeout: 90000
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 90000
