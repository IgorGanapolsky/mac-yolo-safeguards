# Fresh-user ConnectMacGate (Igor P0): cold install must show the gate with the Tailscale-
# first hero (manual 100.x paste) — not chat, not "Reconnecting". Numbered fresh-user steps
# live on ChatConnectionPanel after a saved Mac disconnects; ConnectMacGate intentionally
# dropped them (ConnectMacGate.test.tsx). Unit copy: freshUserOnboarding.test.ts.
appId: com.iganapolsky.hermesmobile
---
# clearState required: with saved profiles the gate is suppressed (correct product behavior).
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    notVisible:
      id: "hermes-bootstrap"
    timeout: 90000
- runFlow: dismiss-notification-permission.yaml
- runFlow: dismiss-print-interruption.yaml
- extendedWaitUntil:
    visible:
      id: "connect-mac-gate"
    timeout: 60000
- assertVisible:
    id: "connect-mac-onboarding-card"
# Hero is ManualComputerAddressForm (Tailscale paste), not numbered steps.
- assertVisible:
    id: "connect-manual-form"
- assertVisible:
    id: "connect-mac-gate-dismiss"
# Fresh install must never flash reconnecting copy on first paint.
- assertNotVisible: "Reconnecting"
- assertNotVisible: "Reconnecting…"
# Relative ../docs/proofs paths fail under Maestro's takeScreenshot cwd (FileNotFound).
- takeScreenshot: build/tailscale-onboarding-copy/connect-mac-gate-steps
