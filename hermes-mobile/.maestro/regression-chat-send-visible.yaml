# Regression: after Send, the user bubble must stay visible and latest content reachable
# (send persistence + auto-scroll / virtualization pins latest).
# Note: Android Maestro inputText can fail to hydrate RN TextInput (IME composing) — see
# docs/RELEASE-SAFETY-NET.md. Unit tests in ChatScreen.test.tsx are the reliable gate until
# Maestro clipboard/paste path is proven green on device.
appId: com.iganapolsky.hermesmobile
---
- launchApp
- extendedWaitUntil:
    notVisible:
      id: "hermes-bootstrap"
    timeout: 90000
- runFlow: dismiss-print-interruption.yaml
- runFlow: chat-e2e-bootstrap.yaml
- runFlow:
    when:
      notVisible:
        id: "chat-input"
    commands:
      - tapOn:
          id: "tab-hermes"
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 30000
- tapOn:
    id: "chat-input"
- eraseText
# Explicit both sides of the mutation: the clear must land before typing, and the
# typed value must be in the controlled TextInput before Send is tapped. Tapping
# Send on a composer that has not hydrated yet sends nothing and the bubble
# assertions below then fail for a reason that has nothing to do with the product.
# The empty proof is the composer PLACEHOLDER, which renders only while the value is
# the empty string — unlike `notVisible: "make money today"`, which goes true after
# one character is deleted and is already true over an unrelated leftover draft that
# this flow would then append to and send.
- extendedWaitUntil:
    visible: "Type a message to Hermes|Message your computer…"
    timeout: 15000
- inputText: "make money today"
- extendedWaitUntil:
    visible: "make money today"
    timeout: 15000
- hideKeyboard
- tapOn:
    id: "chat-send-button"
- scrollUntilVisible:
    element:
      id: "chat-message-user"
    direction: UP
    timeout: 20000
    speed: 40
- assertVisible:
    id: "chat-message-user"
- assertVisible: "make money today"
