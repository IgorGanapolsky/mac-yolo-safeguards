# iPad simulator edge matrix for the real fresh-user Release build.
#
# Run through scripts/run-simulator-e2e.sh with EXPO_PUBLIC_E2E_AUTOMATION=0.
# This flow intentionally avoids demo/setup deep links: the normal simulator
# suite embeds the automation flag, which hides the ConnectMacGate and cannot
# prove the App Store user's first launch.
appId: com.iganapolsky.hermesmobile
---
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    notVisible:
      id: "hermes-bootstrap"
    timeout: 120000

# The full iPad onboarding card must be reachable and internally complete.
# At maximum Dynamic Type the card intentionally grows beyond one viewport, so
# prove each required control is reachable by scrolling instead of assuming all
# controls remain simultaneously visible.
- extendedWaitUntil:
    visible:
      id: "connect-mac-gate"
    timeout: 60000
- assertVisible:
    id: "connect-mac-onboarding-card"
- assertVisible:
    id: "connect-mac-gate-dismiss"
- assertNotVisible: "Reconnecting"
- assertNotVisible: "Reconnecting…"
- takeScreenshot: build/ipad-simulator-edge-cases/fresh-user-connect-gate

# iPad users rotate at any point. Exercise both landscape directions while the
# fresh-user gate owns the screen, then restore portrait before continuing.
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "connect-mac-gate"
- assertVisible:
    id: "connect-mac-onboarding-card"
- assertVisible:
    id: "connect-mac-gate-dismiss"
- takeScreenshot: build/ipad-simulator-edge-cases/onboarding-landscape-left
- setOrientation: LANDSCAPE_RIGHT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "connect-mac-gate"
- assertVisible:
    id: "connect-mac-onboarding-card"
- assertVisible:
    id: "connect-mac-gate-dismiss"
- takeScreenshot: build/ipad-simulator-edge-cases/onboarding-landscape-right
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "connect-mac-gate"
- scrollUntilVisible:
    element:
      id: "connect-manual-input"
    direction: DOWN
    timeout: 30000
    speed: 40
- assertVisible:
    id: "connect-manual-input"
- scrollUntilVisible:
    element:
      id: "connect-manual-submit"
    direction: DOWN
    timeout: 30000
    speed: 40
- assertVisible:
    id: "connect-manual-submit"
- scrollUntilVisible:
    element:
      id: "connect-search-wifi"
    direction: DOWN
    timeout: 30000
    speed: 40
- assertVisible:
    id: "connect-search-wifi"
- scrollUntilVisible:
    element:
      id: "connect-mac-gate-dismiss"
    direction: UP
    timeout: 30000
    speed: 40

# Dismissal exposes all three bottom tabs. Keeping every tab visible after the
# keyboard is hidden is the executable safe-area contract for an iPad viewport.
- tapOn:
    id: "connect-mac-gate-dismiss"
- extendedWaitUntil:
    notVisible:
      id: "connect-mac-gate"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "tab-hermes"
    timeout: 60000
- assertVisible:
    id: "tab-leash"
- assertVisible:
    id: "tab-settings"
- takeScreenshot: build/ipad-simulator-edge-cases/tabs-safe-area

# Exercise both non-chat tabs, then return to the composer without demo state.
- tapOn:
    id: "tab-leash"
- extendedWaitUntil:
    notVisible:
      id: "tab-screen-loading"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "THUMBGATE_LEASH"
    timeout: 60000
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    notVisible:
      id: "tab-screen-loading"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "SETTINGS"
    timeout: 60000
- tapOn:
    id: "tab-hermes"
- extendedWaitUntil:
    notVisible:
      id: "tab-screen-loading"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 60000

# iOS Fabric regression: focus, enter a value, erase it, and enter the exact
# same value again while the native keyboard remains active.
#
# FLAKE FIX 2026-07-29 (observed: run passed 4x then failed on identical app code
# with `Assertion is false: "make money today" is visible` on the RETYPE).
# `eraseText` and `inputText` are asynchronous with respect to the controlled RN
# TextInput: eraseText returns when the keystrokes are dispatched, not when the
# empty value has round-tripped through React state. Typing immediately after can
# interleave with the in-flight clear, leaving a partial value that the following
# assert never sees. Maestro's implicit smart wait on a bare `assertVisible` is
# too short to cover a slow CI simulator, so every mutation boundary below is an
# EXPLICIT wait: prove the field is empty before retyping, then wait for the
# retyped value with a real timeout instead of relying on the implicit one.
#
# The empty proof asserts the composer PLACEHOLDER, which React Native renders only
# while the TextInput value is the empty string. `notVisible: "make money today"`
# was deliberately rejected here: it goes true the moment a single character is
# deleted, and it is already true when the composer holds an unrelated leftover
# draft — so it would pass mid-clear and let the same partial-value race through.
# Both idle placeholder variants are matched because this flow runs with no session
# ("Message your computer…") while the demo-bootstrapped chat flows have one
# ("Type a message to Hermes"); neither can render unless the field is empty.
- tapOn:
    id: "chat-input"
    point: "95%,50%"
- eraseText: 100
- extendedWaitUntil:
    visible: "Type a message to Hermes|Message your computer…"
    timeout: 15000
- inputText: "make money today"
- extendedWaitUntil:
    visible: "make money today"
    timeout: 15000
- tapOn:
    id: "chat-input"
    point: "95%,50%"
- eraseText: 100
- extendedWaitUntil:
    visible: "Type a message to Hermes|Message your computer…"
    timeout: 15000
- inputText: "make money today"
- extendedWaitUntil:
    visible: "make money today"
    timeout: 15000

# Rotate while the native input is focused. Appending after each rotation is
# stronger than a screenshot-only assertion: it proves focus/input survived.
# Each append is awaited explicitly — a rotation re-layout plus a controlled
# TextInput update is exactly the "heavy animation" case where Maestro's implicit
# smart wait degrades on a loaded CI simulator.
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "chat-input"
- inputText: "!"
- extendedWaitUntil:
    visible: "make money today!"
    timeout: 15000
- takeScreenshot: build/ipad-simulator-edge-cases/composer-landscape-keyboard
- setOrientation: LANDSCAPE_RIGHT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "chat-input"
- inputText: "?"
- extendedWaitUntil:
    visible: "make money today!?"
    timeout: 15000
- setOrientation: UPSIDE_DOWN
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "chat-input"
- inputText: "#"
- extendedWaitUntil:
    visible: "make money today!?#"
    timeout: 15000
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "chat-input"
- inputText: "."
- extendedWaitUntil:
    visible: "make money today!?#."
    timeout: 15000

# A focused draft must survive a real iPad background/foreground transition.
# Returning with stopApp:false resumes the same process instead of masking state
# loss with a relaunch; re-tapping proves the input remains usable after resume.
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 30000
# The composer re-mounting after a foreground transition is asynchronous, so the
# restored draft needs an explicit wait too — not a bare assert.
- extendedWaitUntil:
    visible: "make money today!?#."
    timeout: 30000
- tapOn:
    id: "chat-input"
    point: "95%,50%"
- inputText: "+"
- extendedWaitUntil:
    visible: "make money today!?#.+"
    timeout: 15000

# An intentional keyboard dismissal must win over the rotation refocus repair.
# Rotating immediately after hideKeyboard used to look identical to the native
# blur-before-Dimensions event ordering. Input without a new tap must be ignored.
#
# This is the one place a fixed settle is CORRECT rather than a papered-over race:
# the contract is that something must NOT happen, and you cannot wait for the
# absence of an event. Give the app a real window to (wrongly) apply the input,
# then assert both that the stray character was dropped and that the draft is
# byte-identical. Without the settle the negative assert could pass vacuously
# simply because the input had not rendered yet.
- hideKeyboard
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "x"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "make money today!?#.+x"
- assertVisible: "make money today!?#.+"
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "chat-input"
    point: "95%,50%"
- eraseText: 100
- extendedWaitUntil:
    visible: "Type a message to Hermes|Message your computer…"
    timeout: 15000
- hideKeyboard
- assertVisible:
    id: "tab-hermes"
- assertVisible:
    id: "tab-leash"
- assertVisible:
    id: "tab-settings"
- takeScreenshot: build/ipad-simulator-edge-cases/composer-and-tabs

# A cold relaunch must retain the user's dismissal, land on the Hermes tab, and
# leave the native composer focusable rather than reopening onboarding.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    notVisible:
      id: "hermes-bootstrap"
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: "tab-hermes"
    timeout: 60000
- assertNotVisible:
    id: "connect-mac-gate"
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 60000
- tapOn:
    id: "chat-input"
- inputText: "make money today"
- extendedWaitUntil:
    visible: "make money today"
    timeout: 15000
- eraseText: 100
- extendedWaitUntil:
    visible: "Type a message to Hermes|Message your computer…"
    timeout: 15000
- hideKeyboard
- assertVisible:
    id: "tab-leash"
- assertVisible:
    id: "tab-settings"
- takeScreenshot: build/ipad-simulator-edge-cases/relaunch-safe-area
