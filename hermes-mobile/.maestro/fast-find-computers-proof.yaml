# Device/CI: appId must match app.json package (paid install rewrites in run-maestro-for-app).
appId: com.iganapolsky.hermesmobile
---
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    notVisible:
      id: "hermes-bootstrap"
    timeout: 90000
- runFlow: dismiss-mac-picker.yaml
- runFlow:
    when:
      notVisible:
        id: "chat-input"
    commands:
      - tapOn:
          id: "tab-hermes"
- extendedWaitUntil:
    visible:
      id: "chat-screen-header"
    timeout: 45000
- tapOn:
    id: "chat-context-mac-button"
- extendedWaitUntil:
    visible:
      id: "mac-picker-modal"
    timeout: 15000
- tapOn:
    text: "Find computers"
- extendedWaitUntil:
    notVisible:
      text: "Finding computers…"
    timeout: 8000
- assertVisible:
    id: "gateway-profile-list"
# When selected Mac is offline, ThumbGate.app Continuity path must be offered.
- extendedWaitUntil:
    visible:
      id: "thumbgate-promo-computer_picker_unreachable"
    timeout: 10000
- assertVisible:
    text: "Open ThumbGate.app"
