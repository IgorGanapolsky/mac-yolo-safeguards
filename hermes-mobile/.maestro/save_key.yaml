appId: com.iganapolsky.hermesmobile
env:
  # Supplied at run time: maestro test -e GATEWAY_API_KEY=...
  # NEVER commit a real key here (2026-08-19: a live gateway key sat in this
  # PUBLIC repo for ~25 days and had to be rotated).
  GATEWAY_API_KEY: REPLACE_ME
---
- launchApp
- runFlow: e2e-bootstrap.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "SETTINGS"
- scrollUntilVisible:
    element:
      id: "gateway-api-key-input"
    direction: DOWN
    timeout: 60000
    speed: 35
- tapOn:
    id: "gateway-api-key-input"
- inputText: "${GATEWAY_API_KEY}"
- runFlow:
    when:
      platform: android
    commands:
      - back
- runFlow:
    when:
      platform: ios
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: "save-settings-button"
    direction: DOWN
    timeout: 60000
    speed: 35
- tapOn:
    id: "save-settings-button"
- tapOn: "OK"
- tapOn: "Hermes"
- extendedWaitUntil:
    visible:
      id: "HERMES CHAT"
    timeout: 30000
