# Chat send — user bubble must stay visible (guards refresh-race / virtualization regression).
#
# ROOT CAUSE NOTE (open harness bug, not solely app bug):
# On Android, Maestro `inputText` often leaves RN TextInput empty (IME composing region), so
# Send taps with blank composer and this flow fails even when unit optimistic-send tests pass
# (see plan.md T-70 Decision Log 2026-07-04). Desired product behavior is still asserted here
# so CI/device E2E fail closed once IME input is fixed or a clipboard-paste path is adopted.
# Continuous E2E still runs this flow; PR emulator gate uses ship-guard only (no typing).
appId: com.iganapolsky.hermesmobile
---
- launchApp
- extendedWaitUntil:
    notVisible:
      id: "hermes-bootstrap"
    timeout: 90000
- runFlow: dismiss-print-interruption.yaml
- runFlow: chat-e2e-bootstrap.yaml
- runFlow:
    when:
      notVisible:
        id: "HERMES CHAT"
    commands:
      - tapOn:
          id: "tab-hermes"
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 30000
- tapOn:
    id: "chat-input"
- eraseText
# Wait for the clear to round-trip, then for the typed value to actually be in the
# controlled TextInput, before Send is tapped. A bare `waitForAnimationToEnd` only
# waits for the UI to stop moving — it does not prove the value landed.
# The empty proof is the composer PLACEHOLDER, which renders only while the value is
# the empty string. `notVisible: "make money today"` would go true after a single
# character is deleted AND is already true when a reused composer holds some other
# draft — which in a SEND flow risks appending to that leftover and sending it.
- extendedWaitUntil:
    visible: "Type a message to Hermes|Message your computer…"
    timeout: 15000
- inputText: "make money today"
- extendedWaitUntil:
    visible: "make money today"
    timeout: 15000
- runFlow: hide-keyboard-safe.yaml
# Emulator/phone dogfood often resumes a 100k+ token thread; banner blocks Send.
- runFlow: dismiss-mega-session-warn.yaml
- tapOn:
    id: "chat-send-button"
# Send on a warn-level mega session opens Alert — start fresh then retype/send.
- runFlow:
    when:
      visible: "Very large chat session"
    commands:
      - tapOn: "Start fresh chat"
      - extendedWaitUntil:
          visible:
            id: "chat-input"
          timeout: 30000
      - tapOn:
          id: "chat-input"
      - eraseText
      - extendedWaitUntil:
          visible: "Type a message to Hermes|Message your computer…"
          timeout: 15000
      - inputText: "make money today"
      - extendedWaitUntil:
          visible: "make money today"
          timeout: 15000
      - runFlow: hide-keyboard-safe.yaml
      - tapOn:
          id: "chat-send-button"
# Prefer stable testID; scroll first because long sessions virtualize off-screen bubbles.
- scrollUntilVisible:
    element:
      id: "chat-message-user"
    direction: UP
    timeout: 20000
    speed: 40
- extendedWaitUntil:
    visible:
      id: "chat-message-user"
    timeout: 15000
- assertVisible:
    id: "chat-message-user"
- assertVisible: "make money today"
