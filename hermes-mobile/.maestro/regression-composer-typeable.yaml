# Regression for the #91 OTA "keyboard opens, can't type" bug: the composer was lifted
# above the keyboard with transform:translateY, which on Android leaves the TextInput's
# touch hit-rect behind — visible but UNTAPPABLE. The fix uses layout marginBottom so the
# hit-rect moves with the input.
#
# 2026-07-13 evidence: append-with-caret-at-end is flaky on Samsung Gboard — a second
# tap often leaves the caret mid-string so "-probe-2" inserts as typeable-probe-probe-2-1.
# Prove the open-keyboard re-tap path by erase+retype while the dock is lifted instead.
appId: com.iganapolsky.hermesmobile
---
- launchApp
- extendedWaitUntil:
    notVisible:
      id: "hermes-bootstrap"
    timeout: 90000
- runFlow: dismiss-print-interruption.yaml
- runFlow: chat-e2e-bootstrap.yaml
- runFlow:
    when:
      notVisible:
        id: "chat-input"
    commands:
      - tapOn:
          id: "tab-hermes"
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 30000
# First pass proves the native text-entry path updates the controlled TextInput on
# both Android and iOS. The exact prompt matters: repeating a just-sent value is the
# iOS regression guarded by ChatScreen's platform-specific IME suppression.
- tapOn:
    id: "chat-input"
    point: "95%,50%"
- eraseText: 100
# Prove the clear actually round-tripped through React state before retyping.
# A tapOn between eraseText and inputText is NOT a wait — it only re-focuses.
# The proof is the composer PLACEHOLDER, which renders only while the value is the
# empty string. `notVisible: "make money today"` is NOT an empty proof: it goes true
# as soon as one character is deleted, so the retype could still interleave with an
# in-flight clear — the exact partial-value race this flow exists to catch. It is
# also already true whenever the composer holds any other draft.
- extendedWaitUntil:
    visible: "Type a message to Hermes|Message your computer…"
    timeout: 15000
- tapOn:
    id: "chat-input"
- inputText: "make money today"
- extendedWaitUntil:
    visible: "make money today"
    timeout: 15000
# CRITICAL: keyboard OPEN and dock lifted. Re-tap, erase, and enter the exact same
# value again. Android proves the lifted hit-rect remains tappable; iOS proves the
# controlled TextInput accepts the previous value rather than suppressing it.
- tapOn:
    id: "chat-input"
    # A center tap can put the Android caret before the final character, leaving
    # a suffix behind after eraseText (observed as "ymake money today" in CI).
    point: "95%,50%"
- eraseText: 100
- extendedWaitUntil:
    visible: "Type a message to Hermes|Message your computer…"
    timeout: 15000
- tapOn:
    id: "chat-input"
- inputText: "make money today"
- extendedWaitUntil:
    visible: "make money today"
    timeout: 15000
- eraseText
- extendedWaitUntil:
    visible: "Type a message to Hermes|Message your computer…"
    timeout: 15000
