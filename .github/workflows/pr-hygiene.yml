name: PR hygiene

# Autonomous janitor so the open PR and issue lists do not freeze.
#   1. auto-merge: any open, non-draft human PR that is mergeable + all required
#      checks green lands on its own (GitHub waits for green; no human click).
#      Dependabot is excluded here; dependabot-automerge.yml separately admits only
#      semver-minor/patch updates, while major upgrades require compatibility review.
#   2. stale: a PR or issue with no activity gets a warning, then closes.
#      The close clock is the newest of creation, a non-bot comment or review,
#      both dates on every commit, a non-bot reopen, a convert-to-draft, and a
#      head force-push. The janitor's own comments do not reset it. Drafts are
#      included: a draft with no human activity is not live work.
#   3. drain (schedule and manual run only): close drafts idle for 14 days and
#      issues idle for 30 days in one pass, so a multi-week freeze does not wait
#      out the stale label window. Dependency PRs stay open so a red security
#      bump is not thrown away.
# Exempt labels: keep, pinned, security, blocked. PRs labeled dependencies too.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-hygiene
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Enable auto-merge on green PRs
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge where safe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Non-draft human PRs only. Dependabot updates are governed by the
          # semver-aware workflow, so majors can never inherit broad auto-merge.
          gh pr list --repo "$REPO" --state open --json number,isDraft,author \
            --jq '.[] | select(.isDraft == false and .author.login != "app/dependabot" and .author.login != "dependabot[bot]") | .number' | while read -r pr; do
            if gh pr merge "$pr" --repo "$REPO" --squash --auto --delete-branch 2>/dev/null; then
              echo "auto-merge enabled: #$pr"
            else
              echo "skip #$pr (conflicted/blocked/already-set)"
            fi
          done

  stale:
    name: Mark and close stale PRs
    # Drain first. actions/stale comments when it marks an item, and that
    # comment refreshes updatedAt, so a parallel drain would skip the item.
    needs: drain
    if: always() && (needs.drain.result == 'success' || needs.drain.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ github.token }}
          days-before-issue-stale: 23
          days-before-issue-close: 7
          days-before-pr-stale: 4
          days-before-pr-close: 3
          stale-pr-label: stale
          stale-issue-label: stale
          exempt-pr-labels: keep,pinned,security,blocked,dependencies
          exempt-issue-labels: keep,pinned,security,blocked
          exempt-draft-pr: false
          delete-branch: true
          ascending: true   # oldest first, so the backlog drains predictably
          operations-per-run: 100
          stale-pr-message: >
            This PR has had no activity for 4 days. It will be closed in 3 more days
            if nothing changes. Push a commit, comment, or add the `keep` label to hold it.
          close-pr-message: >
            Closed automatically after 7 days of inactivity by the PR-hygiene bot.
            The branch is deleted but the commits are preserved on the pull request —
            reopen or re-push to revive. Add the `keep` label next time to exempt.
          stale-issue-message: >
            No update for 23 days. This issue closes in 7 days unless someone
            comments or adds the `keep` label.
          close-issue-message: >
            Closed after 30 days without an update. Reopen if it is still true.

  drain:
    name: Close abandoned drafts and silent issues
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Drain frozen drafts and issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PY'
          import json, os, subprocess
          from datetime import datetime, timezone

          repo = os.environ["REPO"]
          exempt = {"keep", "pinned", "security", "blocked"}
          now = datetime.now(timezone.utc)

          def gh(*args):
              subprocess.run(["gh", *args], check=True)

          for name, color, desc in (
              ("keep", "0E8A16", "Janitor must not close this"),
              ("pinned", "1D76DB", "Pinned. Janitor must not close this"),
              ("security", "B60205", "Security follow-up. Janitor must not close this"),
          ):
              subprocess.run([
                  "gh", "label", "create", name, "--repo", repo,
                  "--color", color, "--description", desc, "--force",
              ], check=False)

          owner, name = repo.split("/", 1)

          def graphql(query):
              out = subprocess.check_output(
                  ["gh", "api", "graphql", "-f", f"query={query}"],
                  text=True,
              )
              return json.loads(out)

          def page_nodes(connection, selection):
              items = []
              cursor = None
              while True:
                  after = "" if cursor is None else f', after: "{cursor}"'
                  query = (
                      'query { repository(owner: "%s", name: "%s") { %s(states: [OPEN], first: 100%s) '
                      "{ pageInfo { hasNextPage endCursor } nodes { %s } } } }"
                      % (owner, name, connection, after, selection)
                  )
                  data = graphql(query)["data"]["repository"][connection]
                  items.extend(data["nodes"])
                  if not data["pageInfo"]["hasNextPage"]:
                      return items
                  cursor = data["pageInfo"]["endCursor"]

          BOTS = {"github-actions[bot]", "github-actions"}
          DEPENDABOT = {"app/dependabot", "dependabot[bot]"}

          def names(row):
              labels = row.get("labels") or []
              if isinstance(labels, dict):
                  labels = labels.get("nodes") or []
              return {label.get("name") for label in labels}

          def parse_time(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def page_subject(root, number, field, selection, extra=""):
              # gh pr view --json commits stops at 100 (cli/cli#13338). The same
              # cap applies to comments and reviews, so page every clock source.
              items = []
              cursor = None
              while True:
                  after = "" if cursor is None else ', after: "%s"' % cursor
                  query = (
                      'query { repository(owner: "%s", name: "%s") { %s(number: %d) { '
                      "%s(first: 100%s%s) { pageInfo { hasNextPage endCursor } nodes { %s } } } } }"
                      % (owner, name, root, number, field, extra, after, selection)
                  )
                  connection = graphql(query)["data"]["repository"][root][field]
                  items.extend(connection["nodes"] or [])
                  if not connection["pageInfo"]["hasNextPage"]:
                      return items
                  cursor = connection["pageInfo"]["endCursor"]

          def consider(times, login, value):
              if login not in BOTS and value:
                  times.append(parse_time(value))

          def human_idle(kind, number):
              # updatedAt includes the janitor's own stale comment, which reset
              # every August draft and issue to "today" on 2026-10-28.
              root = "issue" if kind == "issue" else "pullRequest"
              fields = "createdAt,labels,title" if kind == "issue" else "createdAt,labels,isDraft,author"
              fresh = json.loads(subprocess.check_output([
                  "gh", kind, "view", str(number), "--repo", repo, "--json", fields,
              ], text=True))
              times = [parse_time(fresh["createdAt"])]
              for comment in page_subject(root, number, "comments", "createdAt author { login }"):
                  login = ((comment.get("author") or {}).get("login")) or ""
                  consider(times, login, comment.get("createdAt"))
              if kind == "pr":
                  for review in page_subject(root, number, "reviews", "submittedAt author { login }"):
                      login = ((review.get("author") or {}).get("login")) or ""
                      consider(times, login, review.get("submittedAt"))
                  for node in page_subject(root, number, "commits", "commit { authoredDate committedDate }"):
                      commit = node.get("commit") or {}
                      for key in ("authoredDate", "committedDate"):
                          if commit.get(key):
                              times.append(parse_time(commit[key]))
                  selection = (
                      "... on ReopenedEvent { createdAt actor { login } } "
                      "... on ConvertToDraftEvent { createdAt actor { login } } "
                      "... on HeadRefForcePushedEvent { createdAt actor { login } }"
                  )
                  extra = ", itemTypes: [REOPENED_EVENT, CONVERT_TO_DRAFT_EVENT, HEAD_REF_FORCE_PUSHED_EVENT]"
              else:
                  selection = "... on ReopenedEvent { createdAt actor { login } }"
                  extra = ", itemTypes: [REOPENED_EVENT]"
              for event in page_subject(root, number, "timelineItems", selection, extra):
                  login = ((event.get("actor") or {}).get("login")) or ""
                  consider(times, login, event.get("createdAt"))
              return (now - max(times)).total_seconds() / 86400, fresh

          prs = page_nodes(
              "pullRequests",
              "number updatedAt isDraft author { login } labels(first: 20) { nodes { name } }",
          )
          for row in prs:
              labels = names(row)
              author = (row.get("author") or {}).get("login") or ""
              if author in {"app/dependabot", "dependabot[bot]"} or "dependencies" in labels:
                  if "stale" in labels:
                      gh("pr", "edit", str(row["number"]), "--repo", repo, "--remove-label", "stale")
                      print(f"unstale dependency #{row['number']}")
                  continue
              if labels & exempt:
                  continue
              if not row.get("isDraft"):
                  continue
              age, fresh = human_idle("pr", row["number"])
              fresh_author = ((fresh.get("author") or {}).get("login")) or ""
              if fresh_author in DEPENDABOT or "dependencies" in names(fresh):
                  continue
              if names(fresh) & exempt or not fresh.get("isDraft") or age < 14:
                  continue
              gh(
                  "pr", "close", str(row["number"]), "--repo", repo, "--delete-branch",
                  "--comment",
                  "Closed by the repo janitor. This draft had no update for 14 days, "
                  "so it was not in the merge queue. Reopen and push to revive it. "
                  "Add the `keep` label to hold a draft open.",
              )
              print(f"closed draft #{row['number']}")

          issues = page_nodes(
              "issues",
              "number title updatedAt labels(first: 20) { nodes { name } }",
          )
          for row in issues:
              title = row.get("title") or ""
              if title.lower().startswith("security") and "security" not in names(row):
                  gh("issue", "edit", str(row["number"]), "--repo", repo, "--add-label", "security")
                  print(f"hold security issue #{row['number']}")

          for row in issues:
              labels = names(row)
              title = row.get("title") or ""
              if title.lower().startswith("security"):
                  print(f"hold security issue #{row['number']}")
                  continue
              if labels & exempt:
                  continue
              age, fresh = human_idle("issue", row["number"])
              if names(fresh) & exempt:
                  continue
              if (fresh.get("title") or "").lower().startswith("security") or age < 30:
                  continue
              gh(
                  "issue", "close", str(row["number"]), "--repo", repo,
                  "--reason", "not planned",
                  "--comment",
                  "Closed by the repo janitor after 30 days with no update. "
                  "Reopen if this is still true, or add the `keep` label to hold it.",
              )
              print(f"closed issue #{row['number']}")
          PY
