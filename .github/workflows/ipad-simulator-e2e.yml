name: Hermes Mobile iPad Simulator E2E

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: >-
    hermes-mobile-ipad-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || github.event_name == 'merge_group'
      && format('mq-{0}', github.ref)
      || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect iPad-relevant changes
    runs-on: ubuntu-latest
    outputs:
      run-ipad: ${{ steps.diff.outputs.run-ipad }}
      trusted-source: ${{ steps.diff.outputs.trusted-source }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: diff
        name: Decide whether iPad E2E is required
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -eu
          trusted_source=true
          if [ "${{ github.event_name }}" = "pull_request" ] &&
            [ "$PR_HEAD_REPO" != "${{ github.repository }}" ]; then
            trusted_source=false
          fi
          echo "trusted-source=$trusted_source" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run-ipad=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] &&
            [ "$PR_DRAFT" = "true" ]; then
            echo "run-ipad=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha="${BASE_SHA:-}"
          if [ -z "$base_sha" ] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse "${HEAD_SHA}^")"
          fi
          if git diff --quiet "$base_sha" "$HEAD_SHA" -- \
            hermes-mobile/ .github/workflows/ipad-simulator-e2e.yml; then
            echo "run-ipad=false" >> "$GITHUB_OUTPUT"
          else
            echo "run-ipad=true" >> "$GITHUB_OUTPUT"
          fi

  ipad-simulator:
    name: Real-user iPad simulator E2E
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.run-ipad == 'true' &&
      needs.detect-changes.outputs.trusted-source == 'true'
    # `ipad-simulator` is deliberately a reserved capability label. The MacBook
    # carrying it does not carry the generic `hermes-e2e` label, so ordinary Mac
    # CI cannot starve this required device gate.
    runs-on: ${{ fromJSON('["self-hosted", "ipad-simulator"]') }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hermes-mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify self-hosted iPad runner toolchain
        env:
          JAVA_HOME: /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
        run: |
          test -x "$JAVA_HOME/bin/java"
          test -x "$HOME/.maestro/bin/maestro"
          xcodebuild -version
          xcrun simctl list devices available -j | node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(0, "utf8"));
            const hasIpad = Object.values(payload.devices || {})
              .flat()
              .some((device) => device.isAvailable !== false && device.name.startsWith("iPad"));
            if (!hasIpad) process.exit(1);
          '
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run real-user edge cases on a strict iPad simulator
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
          JAVA_HOME: /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_ALLOW_FAILURE: 'true'
        run: |
          export PATH="$JAVA_HOME/bin:$HOME/.maestro/bin:$PATH"
          bash ./scripts/run-ipad-simulator-e2e.sh .maestro/ipad-simulator-edge-cases.yaml

  required-gate:
    name: Hermes Mobile iPad simulator gate
    needs:
      - detect-changes
      - ipad-simulator
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the conditional iPad result
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          RUN_IPAD: ${{ needs.detect-changes.outputs.run-ipad }}
          TRUSTED_SOURCE: ${{ needs.detect-changes.outputs.trusted-source }}
          IPAD_RESULT: ${{ needs.ipad-simulator.result }}
        run: |
          set -eu
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::iPad change detection failed: $DETECT_RESULT"
            exit 1
          fi
          if [ "$RUN_IPAD" = "true" ] && [ "$TRUSTED_SOURCE" != "true" ]; then
            echo "::error::Mobile changes from fork PRs cannot execute on the self-hosted iPad runner."
            exit 1
          fi
          if [ "$RUN_IPAD" = "true" ] && [ "$IPAD_RESULT" != "success" ]; then
            echo "::error::Required real-user iPad E2E did not pass: $IPAD_RESULT"
            exit 1
          fi
          if [ "$RUN_IPAD" = "true" ]; then
            echo "Required real-user iPad E2E passed."
          else
            echo "Heavy iPad E2E not required for this draft or unrelated change."
          fi
