name: Hermes control plane

concurrency:
  group: hermes-control-plane-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/hermes-control-plane/**"
      - "services/hermes-cloud-runner/**"
      - "tools/hermes-cloud-connector.js"
      - "tests/test-hermes-cloud-connector.js"
      - "tests/test-hermes-business-e2e.js"
      - "tests/test-hermes-cloudflare-deploy-config.js"
      - "tests/test-thumbgate-aeo-monitor.js"
      - "tools/thumbgate-aeo-monitor.js"
      - "config/thumbgate-aeo-prompts.json"
      - "com.igor.thumbgate-aeo-monitor.plist"
      - "scripts/install-thumbgate-aeo-monitor.sh"
      - "docs/THUMBGATE-AEO-MONITORING.md"
      - "docs/RESEARCH-DASHBOARD-E2E-JULY-2026.md"
      - "tests/test-saas-watchdog.sh"
      - "saas/saas-watchdog.sh"
      - "com.igor.saas-watchdog.plist"
      - "tests/test-revenue-anomaly-watchdog.sh"
      - "saas/revenue-anomaly-watchdog.sh"
      - ".github/workflows/revenue-anomaly-watch.yml"
      - "docs/HERMES-CLOUDFLARE-MIGRATION.md"
      - ".github/workflows/hermes-control-plane.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Worker build + dual local E2E + Playwright chromium needs more than 15m.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect control-plane relevance
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "Missing pull-request revisions" >&2
            exit 1
          fi
          set +e
          git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            apps/hermes-control-plane/ \
            services/hermes-cloud-runner/ \
            tools/hermes-cloud-connector.js \
            tests/test-hermes-cloud-connector.js \
            tests/test-hermes-business-e2e.js \
            tests/test-hermes-cloudflare-deploy-config.js \
            tests/test-thumbgate-aeo-monitor.js \
            tools/thumbgate-aeo-monitor.js \
            config/thumbgate-aeo-prompts.json \
            com.igor.thumbgate-aeo-monitor.plist \
            scripts/install-thumbgate-aeo-monitor.sh \
            docs/THUMBGATE-AEO-MONITORING.md \
            docs/RESEARCH-THUMBGATE-AEO-JULY-2026.md \
            docs/RESEARCH-DASHBOARD-E2E-JULY-2026.md \
            tests/test-saas-watchdog.sh \
            saas/saas-watchdog.sh \
            com.igor.saas-watchdog.plist \
            tests/test-revenue-anomaly-watchdog.sh \
            saas/revenue-anomaly-watchdog.sh \
            .github/workflows/revenue-anomaly-watch.yml \
            docs/HERMES-CLOUDFLARE-MIGRATION.md \
            .github/workflows/hermes-control-plane.yml
          diff_status=$?
          set -e
          case "$diff_status" in
            0) echo "relevant=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "relevant=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$diff_status" ;;
          esac
      - name: No control-plane changes
        if: steps.scope.outputs.relevant != 'true'
        run: echo "Control-plane verification is not required for this pull request."
      - uses: actions/setup-node@v7.0.0
        if: steps.scope.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/hermes-control-plane/package-lock.json
      - run: npm ci || npm install
        if: steps.scope.outputs.relevant == 'true'
        working-directory: apps/hermes-control-plane
      - run: npm run lint
        if: steps.scope.outputs.relevant == 'true'
        working-directory: apps/hermes-control-plane
      - name: Reject high or critical dependency advisories
        if: steps.scope.outputs.relevant == 'true'
        run: npm run test:security
        working-directory: apps/hermes-control-plane
      - name: Enforce control-plane unit coverage thresholds
        if: steps.scope.outputs.relevant == 'true'
        run: npm run test:unit
        working-directory: apps/hermes-control-plane
      - run: npm test
        if: steps.scope.outputs.relevant == 'true'
        working-directory: apps/hermes-control-plane
      - run: npm run test:cloudflare-config
        if: steps.scope.outputs.relevant == 'true'
        working-directory: apps/hermes-control-plane
      - name: Verify bounded ThumbGate AI/search visibility monitor
        if: steps.scope.outputs.relevant == 'true'
        run: node tests/test-thumbgate-aeo-monitor.js
      - name: Install Playwright Chromium (machine-routing browser layer)
        if: steps.scope.outputs.relevant == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/hermes-control-plane
      - name: Build Cloudflare Worker once (shared by session + machine E2E)
        if: steps.scope.outputs.relevant == 'true'
        run: npm run build:cloudflare
        working-directory: apps/hermes-control-plane
      - name: Run local Cloudflare Worker session-lifecycle E2E
        if: steps.scope.outputs.relevant == 'true'
        run: node tests/cloudflare-worker-smoke.mjs
        working-directory: apps/hermes-control-plane
      - name: Revenue anomaly watchdog — real local D1 alert proof
        if: steps.scope.outputs.relevant == 'true'
        run: node tests/revenue-anomaly-watchdog-smoke.mjs
        working-directory: apps/hermes-control-plane
      - name: Multi-device machine routing E2E (API + bundle + Playwright)
        if: steps.scope.outputs.relevant == 'true'
        env:
          PLAYWRIGHT_E2E: "1"
        run: node tests/dashboard-machine-routing-e2e.mjs
        working-directory: apps/hermes-control-plane
      - name: Production dashboard copy smoke (public assets)
        if: steps.scope.outputs.relevant == 'true'
        run: npm run test:e2e:prod-copy
        working-directory: apps/hermes-control-plane
        # Network flake must not block merge; agent still runs this post-deploy.
        continue-on-error: true
      - name: Install Playwright Chromium for full-stack browser E2E
        if: steps.scope.outputs.relevant == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/hermes-control-plane
      - name: Full-stack browser E2E (real Worker + real connector process + real Chromium)
        if: steps.scope.outputs.relevant == 'true'
        run: npm run test:e2e:browser
        working-directory: apps/hermes-control-plane
        env:
          CLOUDFLARE_D1_DATABASE_ID: "00000000-0000-4000-8000-000000000000"
          CLOUDFLARE_CUSTOM_DOMAIN: "thumbgate.app"
      - run: bash tests/test-saas-watchdog.sh
        if: steps.scope.outputs.relevant == 'true'
      - run: bash tests/test-revenue-anomaly-watchdog.sh
        if: steps.scope.outputs.relevant == 'true'
      - run: node --test tests/test-hermes-cloud-connector.js
        if: steps.scope.outputs.relevant == 'true'
      - run: node --test tests/test-hermes-business-e2e.js
        if: steps.scope.outputs.relevant == 'true'
      - run: npm test
        if: steps.scope.outputs.relevant == 'true'
        working-directory: services/hermes-cloud-runner
