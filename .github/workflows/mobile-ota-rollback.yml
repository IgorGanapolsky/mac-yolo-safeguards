# Hermes Mobile OTA — EMERGENCY ROLLBACK.
#
# mobile-ota.yml can publish a staged rollout (production_rollout_percentage,
# promote_production_rollout) but has NO way to undo a bad update once it is
# live. `eas update:rollback <groupId>` republishes the update that was live
# BEFORE the given group, so every client reverts to it on next reload — see
# https://docs.expo.dev/eas-update/rollbacks/ (verified 2026-07-26).
#
# Deliberately its OWN workflow, NOT a job bolted onto mobile-ota.yml's
# `publish-production-ota`: that job needs `quality-gate` (unit tests + the
# 35-minute fresh-user stranger cold-start proof) to pass first. During an
# incident the very thing you are rolling back from is often what makes that
# gate RED — requiring it to pass before you can roll back would deadlock the
# recovery. This job only depends on the billing-freeze gate (a real EAS API
# hard-blocker: publishing — rollback included — fails outright while Expo
# billing is frozen), so it is safe to run standalone the moment it's needed.
#
# ============================ 2AM RUNBOOK ============================
# 1) Kill the bad rollout — run "Hermes Mobile OTA" (mobile-ota.yml),
#    workflow_dispatch with:
#      publish_production=false
#      promote_production_rollout=0
#    (stops NEW clients from picking up the bad staged update; clients that
#    already updated still need step 2.)
#
# 2) Run THIS workflow ("Hermes Mobile OTA Rollback"), workflow_dispatch with:
#      channel=production            # or production-android-paid / preview
#      group_id=                     # blank = roll back current channel head;
#                                     # or paste the bad update's group id from
#                                     # `eas update:list --branch production`
#
# 3) Confirm the channel now points at the reverted update:
#      cd hermes-mobile
#      eas channel:view production --non-interactive --json
#    Check "Update Group ID" no longer matches the bad group, and matches the
#    "rolled back TO" id printed in this workflow's job summary. Repeat for
#    production-android-paid if that channel was also affected.
# =======================================================================
#
# runtimeVersion: appVersion (hermes-mobile/app.json). See VERSIONING-AND-RELEASES-JULY-2026.md.
name: Hermes Mobile OTA Rollback

on:
  workflow_dispatch:
    inputs:
      channel:
        description: EAS channel/branch to roll back (production, production-android-paid, preview)
        required: true
        type: string
        default: production
      group_id:
        description: Update group ID to roll back FROM (republishes the update before it). Leave blank to roll back the current head of the channel.
        required: false
        type: string
      message:
        description: Optional rollback message (defaults to auto-generated)
        required: false
        type: string

# Same concurrency group as mobile-ota.yml so a rollback can never race a
# publish/promote — they serialize instead of corrupting each other's state.
concurrency:
  group: hermes-mobile-ota-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  billing-freeze-gate:
    name: Expo billing freeze gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hermes-mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Refuse rollback until Expo billing thawed
        env:
          HERMES_OTA_BILLING_THAW: ${{ vars.HERMES_OTA_BILLING_THAW }}
        run: bash ./scripts/require-expo-billing-thaw.sh

  rollback:
    name: Roll back OTA channel
    needs: [billing-freeze-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hermes-mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes-mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail fast on required EAS auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "Missing required secret: EXPO_TOKEN" >&2
            exit 1
          fi

      - name: Resolve target group ID (defaults to channel head)
        id: resolve
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          GROUP_ID_INPUT: ${{ inputs.group_id }}
        run: |
          set -euo pipefail
          if [ -n "${GROUP_ID_INPUT}" ]; then
            echo "group_id=${GROUP_ID_INPUT}" >> "$GITHUB_OUTPUT"
            echo "Using explicit group_id=${GROUP_ID_INPUT}"
          else
            GROUP_ID="$(eas update:list --branch "${CHANNEL}" --limit 1 --non-interactive --json \
              | node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync(0,"utf8")); const g=(Array.isArray(j)?j:j)?.[0]||j?.currentPage?.[0]||j; const id=g?.group||g?.groupId||g?.id; if(!id){process.stderr.write("No update group found on this channel\n"); process.exit(1)}; process.stdout.write(String(id));')"
            echo "group_id=${GROUP_ID}" >> "$GITHUB_OUTPUT"
            echo "No group_id given — resolved current head of ${CHANNEL} = ${GROUP_ID}"
          fi

      - name: Roll back channel
        id: rollback
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GROUP_ID: ${{ steps.resolve.outputs.group_id }}
          ROLLBACK_MESSAGE: "${{ inputs.message || format('rollback {0}', github.sha) }}"
          EXPO_UPDATE_PRIVATE_KEY: ${{ secrets.EXPO_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SIGN_ARGS=()
          if [ -n "${EXPO_UPDATE_PRIVATE_KEY:-}" ]; then
            printf '%s' "${EXPO_UPDATE_PRIVATE_KEY}" > "$RUNNER_TEMP/expo-update-private-key.pem"
            chmod 600 "$RUNNER_TEMP/expo-update-private-key.pem"
            SIGN_ARGS=(--private-key-path "$RUNNER_TEMP/expo-update-private-key.pem")
            echo "Code signing: enabled via EXPO_UPDATE_PRIVATE_KEY secret"
          else
            echo "Code signing: skipped (no EXPO_UPDATE_PRIVATE_KEY secret — see docs)"
          fi
          echo "::group::eas update:rollback ${GROUP_ID}"
          eas update:rollback "${GROUP_ID}" \
            --message "${ROLLBACK_MESSAGE}" \
            --non-interactive \
            --json \
            "${SIGN_ARGS[@]}" \
            | tee /tmp/eas-ota-rollback.json
          echo "::endgroup::"
          if [ -f "$RUNNER_TEMP/expo-update-private-key.pem" ]; then
            rm -f "$RUNNER_TEMP/expo-update-private-key.pem"
          fi

      - name: Confirm channel now points at reverted update
        id: confirm
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          eas channel:view "${CHANNEL}" --non-interactive --json | tee /tmp/eas-channel-view.json

      - name: Post rollback summary
        if: always()
        env:
          CHANNEL: ${{ inputs.channel }}
          FROM_GROUP_ID: ${{ steps.resolve.outputs.group_id }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          CONFIRM_OUTCOME: ${{ steps.confirm.outcome }}
        run: |
          {
            echo "## Hermes Mobile OTA Rollback"
            echo ""
            echo "- Channel: \`${CHANNEL}\`"
            echo "- Rolled back FROM group: \`${FROM_GROUP_ID}\`"
            echo "- Rollback step: **${ROLLBACK_OUTCOME}**"
            echo "- Channel confirm step: **${CONFIRM_OUTCOME}**"
            echo ""
            if [ "${ROLLBACK_OUTCOME}" = "success" ]; then
              echo "Result: the update published before \`${FROM_GROUP_ID}\` is now"
              echo "republished to \`${CHANNEL}\`. Clients revert on next reload."
            else
              echo "Result: ROLLBACK DID NOT SUCCEED. See the \"Roll back channel\" step log above."
              echo "\`${CHANNEL}\` still serves whatever it served before this run."
            fi
            echo ""
            if [ -f /tmp/eas-ota-rollback.json ]; then
              echo "### eas update:rollback output"
              echo '```json'
              cat /tmp/eas-ota-rollback.json
              echo '```'
            fi
            if [ -f /tmp/eas-channel-view.json ]; then
              echo ""
              echo "### eas channel:view ${CHANNEL}"
              echo '```json'
              cat /tmp/eas-channel-view.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rollback evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hermes-mobile-ota-rollback
          path: |
            /tmp/eas-ota-rollback.json
            /tmp/eas-channel-view.json
          retention-days: 30
