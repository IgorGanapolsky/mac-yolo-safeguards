name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Required when `main` uses a merge queue: without this trigger the queue never
  # receives status checks for macOS guard / mobile-checks / funnel jobs and merges stall.
  # merge_group uses its own ref (not pull_request); keep per-ref concurrency below so
  # queue runs do not re-trigger the 2026-07-10 cancel storm on PR branches.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guard kit is pure Node/shell/static analysis — must stay on ubuntu-latest.
  # 2026-07-30: PR runs on macos-latest sat queued forever (GitHub-hosted macOS starvation)
  # and blocked required check "macOS guard kit" → merges stuck. Keep job name for branch protection.
  macos-guard:
    # Job NAME must stay "macOS guard kit" even though the job no longer runs on
    # macOS: it is a required check in branch protection, and renaming it makes
    # every PR wait forever on a check that will never report. The comment above
    # says exactly this, and a diff3 merge overwrote it anyway on 2026-07-31,
    # leaving conflict markers committed to HEAD and ci.yml unparseable — so CI
    # was not skipping tests, it was not running at all.
    name: macOS guard kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Plan ownership for changed Hermes Mobile files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          TARGET_REF="${{ github.event.pull_request.base.ref || 'main' }}"
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="origin/${TARGET_REF}"
          fi
          git diff --name-only "${BASE_SHA}...HEAD" 2>/dev/null || git diff --name-only HEAD^ HEAD \
            | node tools/plan-coordination-snapshot.js check-ownership --stdin

      # Conflict-marker guard. Second occurrence of this class: PR #1190 removed "a
      # stray diff3 conflict marker committed to main", and on 2026-07-31 a diff3
      # merge committed markers into ci.yml itself — which made the workflow
      # unparseable, so CI was not failing, it was not running. A broken CI file is
      # the one bug that disables every other check, so this runs first and cheap.
      - name: No merge conflict markers
        run: |
          set -eu
          if git grep -nE '^(<<<<<<< |>>>>>>> |\|\|\|\|\|\|\| )' -- ':!node_modules'; then
            echo "::error::Merge conflict markers committed. Resolve before merging."
            exit 1
          fi
          echo "no conflict markers"

      - name: Workflow files parse
        run: |
          set -eu
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for path in glob.glob(".github/workflows/*.yml"):
              try:
                  yaml.safe_load(open(path))
                  print(f"ok   {path}")
              except Exception as exc:
                  print(f"FAIL {path}: {exc}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: JavaScript syntax
        run: |
          set -eu
          git ls-files '*.js' | while IFS= read -r file; do
            node --check "$file"
          done

      - name: Shell syntax
        run: |
          set -eu
          git ls-files '*.sh' | while IFS= read -r file; do
            case "$(head -n 1 "$file")" in
              *bash*) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
          done
          sh -n yolo-health

      - name: Python static checks
        run: |
          set -eu
          python3 -c 'import ast, pathlib, subprocess; tracked=subprocess.check_output(["git", "ls-files", "*.py"], text=True).splitlines(); files=[path for path in tracked if pathlib.Path(path).is_file()]; [ast.parse(pathlib.Path(path).read_text(), filename=path) for path in files]; print(f"parsed {len(files)} Python files")'
          python3 -m venv "$RUNNER_TEMP/ruff-venv"
          "$RUNNER_TEMP/ruff-venv/bin/pip" install --disable-pip-version-check --quiet ruff==0.15.20 Pillow==11.3.0
          git ls-files '*.py' | while IFS= read -r file; do test ! -f "$file" || printf '%s\n' "$file"; done | xargs "$RUNNER_TEMP/ruff-venv/bin/ruff" check --select F,E722

      - name: Hermes store screenshot asset contract
        run: |
          set -eu
          "$RUNNER_TEMP/ruff-venv/bin/python" hermes-mobile/scripts/test-store-screenshot-assets.py

      - name: Hermes gateway watchdog unit tests
        run: |
          set -eu
          bash tests/test-hermes-gateway-watchdog.sh

      - name: Hermes mobile pair script unit tests
        run: |
          set -eu
          bash tests/test-hermes-mobile-pair.sh

      - name: Hermes gateway watchdog e2e orchestration suite
        run: |
          set -eu
          bash tests/test-hermes-gateway-watchdog-e2e.sh

      - name: Hermes SaaS harness installer unit tests (dry-run, hermetic)
        run: |
          set -eu
          bash tests/test-saas-install-harness.sh

      - name: Node tool unit tests
        run: |
          set -u
          # test-hermes-yolo.js spawns the real Hermes binary. The runner has no
          # ~/.local/bin/hermes, so point the wrapper's HERMES_BIN override at a
          # stub emitting the version string the test asserts on.
          stub_dir="$(mktemp -d)"
          printf '#!/bin/sh\necho "Hermes Agent 0.17.0 (ci-stub)"\n' > "$stub_dir/hermes"
          chmod +x "$stub_dir/hermes"
          export HERMES_BIN="$stub_dir/hermes"

          # test-mac-text-hotkeys-config.js asserts on the contents of a personal
          # Hammerspoon config (~/Documents/mac-text-hotkeys/init.lua) not present
          # in the repo. Stubbing it would assert against the stub, so it stays
          # excluded until that config is checked in.
          #
          # test-hermes-buzz-integration.js needs root npm deps (@noble/curves,
          # @scure/base). This job does not npm ci (speed); the dedicated
          # "Hermes Buzz / Nostr integration" step under Public funnel does.
          failed=0
          # Two naming conventions live under tests/: test-*.js and *.test.js.
          # Globbing only the first silently excluded 4 green suites
          # (revenue-send-safety, sender-health-gate, smtp-auth-check,
          # stale-checkout-audit) that had never run in CI. Both shapes now run;
          # tools/test-discovery-audit.js fails the build if a new test is orphaned.
          for f in tests/test-*.js tests/*.test.js; do
            case "$f" in
              tests/test-mac-text-hotkeys-config.js) continue ;;
              tests/test-hermes-buzz-integration.js) continue ;;
            esac
            if node "$f" >/tmp/node-test.log 2>&1; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              cat /tmp/node-test.log
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed node tool unit test file(s) failed"
            exit 1
          fi

      - name: Smoke install and yolo-health
        run: |
          set -eu
          mkdir -p "$HOME/workspace/git/igor/antigravity-hub/antigravity-cli/bin"
          ./install.sh

      - name: NVIDIA SkillEvaluator Tier 1 — skill catalog static checks
        run: |
          set -eu
          # Tier 1 safety and structure checks: PII/secret scan, quality scoring,
          # script linting, and prompt injection detection (non-strict: informational).
          node tools/skill-card-validate.js --json > /tmp/skill-audit.json
          node -e "
            const d = require('/tmp/skill-audit.json');
            console.log('Skill catalog: %d/%d ok, quality avg=%d, PII findings=%d',
              d.passed, d.total,
              Math.round(d.skills.reduce((s,x) => s+x.quality.score, 0)/d.total),
              d.skills.reduce((s,x) => s+x.piiFindings.length, 0));
          "

      # A self-hosted runner is also a live workstation. Never install a PR or
      # branch checkout over its LaunchAgent targets: an older concurrent run
      # can silently roll production safeguards backward. The live copies need
      # only advertise the already-shipped PID lease; test the checkout itself
      # from RUNNER_TEMP.
      - name: Verify live freeze-prevention lease and stage branch guards
        if: runner.environment == 'self-hosted'
        run: |
          set -eu
          bash -n ./sim-runaway-guard.sh
          bash -n ./scripts/memory-pressure-guardian.sh
          for live_guard in \
            "$HOME/.local/bin/sim-runaway-guard.sh" \
            "$HOME/.local/bin/memory-pressure-guardian.sh"; do
            test -x "$live_guard"
            grep -q 'E2E_LEASE_FILE=' "$live_guard"
            printf 'verified live lease support sha256=%s path=%s\n' \
              "$(shasum -a 256 "$live_guard" | awk '{print $1}')" "$live_guard"
          done
          staged_guard_dir="$(mktemp -d "$RUNNER_TEMP/mac-yolo-guards-under-test.XXXXXX")"
          trap 'rm -rf "$staged_guard_dir"' EXIT
          install -m 0755 ./sim-runaway-guard.sh "$staged_guard_dir/sim-runaway-guard.sh"
          install -m 0755 ./scripts/memory-pressure-guardian.sh "$staged_guard_dir/memory-pressure-guardian.sh"
          grep -q 'E2E_LEASE_FILE=' "$staged_guard_dir/sim-runaway-guard.sh"
          grep -q 'E2E_LEASE_FILE=' "$staged_guard_dir/memory-pressure-guardian.sh"
          cmp -s ./sim-runaway-guard.sh "$staged_guard_dir/sim-runaway-guard.sh"
          cmp -s ./scripts/memory-pressure-guardian.sh "$staged_guard_dir/memory-pressure-guardian.sh"

      - name: Guard E2E
        if: runner.os == 'macOS'
        run: |
          set -eu
          tests/test-adb-reverse-device-filter.sh
          tests/test-secondary-browser-reclaim.sh

      # RAG retrieval quality (hermes-retrieval-harness) — added 2026-07-28 after
      # zero-result grepai MCP searches went undetected for days. Measures recall@k,
      # MRR@k, nDCG@k against 8 fixture cases. Fails when the mean recall drops
      # below 1.0 (one or more queries find zero relevant results).
      - name: Retrieval quality eval
        run: node tools/rag-retrieval-eval.js

      # poolside-yolo asserts it runs fully autonomous. It shipped a --mode value
      # pool does not recognise, so pool silently reverted to approval prompts and
      # nobody noticed for days — this suite was never wired into CI. It is
      # hermetic (stubs pool + the gateway) and skips its one live probe when no
      # real pool/gateway is present, so it is safe on a Linux runner.
      - name: Vendor -yolo wrappers
        run: |
          set -eu
          # Run through run-suite, not bare bash: a suite that exits 0 having asserted
          # nothing is VACUOUS, not clean, and must not be reported as a pass. The
          # trailing number is the min assertion count each suite must actually emit.
          bash tests/run-suite.sh tests/test-run-suite.sh 7
          bash tests/run-suite.sh tests/test-poolside-yolo.sh 14
          bash tests/run-suite.sh tests/test-poolside-acp-imageguard.sh 12
          bash tests/run-suite.sh tests/test-hermes-primary-route-recovery.sh 6
          # Mutation control: proves the suites above actually go RED against the
          # real historical bugs, instead of passing while measuring nothing.
          bash tests/run-suite.sh tests/test-harness-verifier-integrity.sh 6
          # ML pipeline: mostly negative controls. Two independent label leaks reached
          # AUC 0.9999 and 1.0000 during development; these assert the pipeline can
          # still tell leaking from learning.
          bash tests/run-suite.sh tests/test-ml-pipeline.sh 9

      - name: Public secret smoke scan
        run: |
          set -eu
          ! git grep -nE '(ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|xai-[A-Za-z0-9_-]{20,}|AIzaSy[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9_]+|TELEGRAM_BOT_TOKEN=|STRIPE_SECRET_KEY=sk_|X-Goog-Signature=|API_SERVER_KEY=['\''"][A-Za-z0-9._-]{20,}[''"]|key=[A-Za-z0-9._-]{20,})' \
            -- ':!.github/workflows/ci.yml' ':!.github/workflows/internal-distribution.yml' ':!.github/workflows/store-release.yml' ':!tests/' ':!docs/'

  revenue-public-checks:
    name: Public funnel checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Public conversion check
        run: node tools/public-conversion-check.js

      - name: Public funnel safety scan
        run: node tools/public-funnel-safety-scan.js

      - name: Public command reference check
        run: node tools/public-command-reference-check.js

      - name: Public local link check
        run: node tools/public-local-link-check.js

      - name: GitHub issue template check
        run: node tools/github-issue-template-check.js

      - name: Store link freshness check
        run: node tools/check-store-links.js

      - name: Publication readiness
        run: node tools/publication-readiness.js

      # Only wire suites that exist on this branch. A 2026-07-31 dirty merge had
      # re-inserted steps for tests that were never committed (test-resource-lease,
      # compose-in-editor, publish-once, …) so Public funnel checks failed MODULE_NOT_FOUND
      # after ci.yml was made parseable again. Absence of a step is not absence of the
      # bug class — add the suite file first, then the CI line.

      # Harness engineering: evidence-only ship claims + non-slop taste golden set
      # (TNS harness-on-the-loop + Taste Labs-style rubric layer, 2026-08).
      - name: Ship-claim gate
        run: node tests/test-ship-claim-gate.js

      - name: CodeQL security helpers
        run: node tests/test-codeql-security-helpers.js

      # Offline shift-left gate: ban the exact pattern classes that piled up
      # 33 open Security alerts (2026-08). Network CodeQL still runs separately.
      - name: CodeQL pattern gate (offline prevention)
        run: |
          set -eu
          node tests/test-codeql-pattern-gate.js
          node tests/test-codeql-agent-hygiene.js
          node tools/codeql-pattern-gate.js --diff origin/main
          node tools/codeql-agent-hygiene.js --pre-ship --skip-network

      # Buzz/Nostr crypto needs root package deps (@noble/curves, @scure/base).
      - name: Hermes Buzz / Nostr integration
        run: |
          set -eu
          npm ci
          node tests/test-hermes-buzz-integration.js
          node --experimental-strip-types tests/test-acp-transformer.mjs || node tests/test-acp-transformer.mjs
          node tools/hermes-integration-paths.js doctor

      # Live open-alert budget (uses GITHUB_TOKEN). Soft on API failure unless CODEQL_GATE_STRICT=1.
      - name: Code scanning open-alert budget
        env:
          CODEQL_GATE_STRICT: ${{ vars.CODEQL_GATE_STRICT || '0' }}
          CODEQL_GATE_SOFT: ${{ vars.CODEQL_GATE_SOFT || '1' }}
        run: |
          set -eu
          node tools/codeql-alert-sync.js --gate --max-high 0 --max-open 15 --json | tee "$RUNNER_TEMP/codeql-gate.json" || {
            # Soft-fail if gh/code-scanning API unavailable (private fork, token scope)
            if [[ "${CODEQL_GATE_STRICT}" == "1" ]]; then exit 1; fi
            echo "codeql-alert-sync gate soft-failed (set CODEQL_GATE_STRICT=1 to hard-fail)"
            exit 0
          }
          # If JSON says ok=false and we have numbers, hard fail
          node -e "const j=require(process.env.RUNNER_TEMP+'/codeql-gate.json'); if(j.ok===false && typeof j.open==='number') process.exit(1);"

      - name: Taste layer golden set
        run: node tests/test-taste-gate.js

      - name: Linear bridge pure helpers
        run: node tests/test-linear-agent-bridge.js

      - name: Harness smeval (ship-honesty offline)
        run: node tests/test-harness-smeval.js

      # Five guessed role addresses hard-bounced within one minute on 2026-07-31,
      # a design-partner pitch went to a security@ disclosure inbox, and four
      # unrelated founders shared one To: line. docs/REVENUE-LOOP.md already banned
      # guessed addresses — as prose, which nothing ran.
      - name: Outreach deliverability gate
        run: node tests/test-outreach-preflight.js

      # ML integrity (fail-closed) — offline platform bar; does not require Stripe/labels.
      - name: ML integrity + platform gate
        run: |
          set -eu
          node tests/test-ml-stack.js
          node tests/test-ml-best-in-class.js
          node tests/test-ml-integrity.js
          ML_GATE_SKIP_UNIT=1 node tools/ml-gate.js --strict-platform
          node tools/ml-integrity.js scan-claim --text "platform ready; production_ml_ready=false"
          ! node tools/ml-integrity.js scan-claim --text "best-in-class production ML model with 100% auc"

      # tinker-brain answers the revenue questions (cash truth, promo bans, score
      # honesty) and nothing in CI had ever run it: its contracts and eval cases
      # were hand-run only, so a regression in the brain could ship green. The
      # suites are hermetic Python — every probe the exporter reads is injected,
      # so no ~/.hermes state, no Ollama, no network, no node.
      - name: Tinker-brain revenue contracts and evals
        run: |
          set -eu -o pipefail
          python3 tests/test-tinker-brain.py 2>&1 | tee "$RUNNER_TEMP/tinker-tests.log"
          # The coverage gate is what stops a routed NON-answer from being emitted with
          # the same confidence as an answer. Unrun, it can rot silently and the only
          # symptom is a confident wrong card — the exact bug it was added to catch.
          python3 tests/test-tinker-brain-coverage.py 2>&1 | tee "$RUNNER_TEMP/tinker-coverage.log"
          python3 tools/tinker-brain/tinker_brain_eval.py | tee "$RUNNER_TEMP/tinker-eval.log"
          # Fail-closed A+ scorecard (purpose-fit pillars). No --heal-first in CI:
          # heal needs live thumbgate.app; store pillar accepts repo-only card.
          python3 tools/tinker-brain/tinker_brain_scorecard.py 2>&1 | tee "$RUNNER_TEMP/tinker-scorecard.log"
          # Both suites exit non-zero on a failing case, but a suite that exits 0
          # having asserted nothing is VACUOUS, not clean — pin the floors too.
          ran="$(sed -n 's/^Ran \([0-9]\{1,\}\) test.*/\1/p' "$RUNNER_TEMP/tinker-tests.log")"
          cov_ran="$(sed -n 's/^Ran \([0-9]\{1,\}\) test.*/\1/p' "$RUNNER_TEMP/tinker-coverage.log")"
          passed="$(sed -n 's|^tinker-brain eval: \([0-9]\{1,\}\)/.*|\1|p' "$RUNNER_TEMP/tinker-eval.log")"
          test "${ran:-0}" -ge 21
          test "${cov_ran:-0}" -ge 11
          test "${passed:-0}" -ge 49
          # Scorecard human line ends with "A+=True required_ok=True"
          grep -q 'A+=True' "$RUNNER_TEMP/tinker-scorecard.log"

  mobile-checks:
    name: Hermes Mobile typecheck and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    defaults:
      run:
        working-directory: hermes-mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Public mobile source privacy scan
        run: npm run privacy:scan

      - name: Release readiness audit
        env:
          REQUIRE_EAS_PROJECT: "1"
        run: npm run release:check

      # Issue #1452: E2E must be a real release gate — fail on skipped, cancelled or missing proof.
      # hermes-mobile-ci-proof-gate.js enforces fresh e2e=pass + unit=pass on the latest.json
      # continuous proof record. This is a visibility check (exit 1 is surfaced as a check annotation);
      # blocking PR merges requires branch-protection enforcement of this job name.
      # continue-on-error: true allows PRs to merge while the gate is still stabilizing; once
      # continuous E2E produces e2e=pass consistently, remove continue-on-error to make this
      # a hard merge gate (per strict:true on main).
      - name: Hermes Mobile continuous E2E proof gate
        continue-on-error: true
        run: node ../tools/hermes-mobile-ci-proof-gate.js --fresh-hours 72

      - name: Type check
        run: npm run typecheck

      - name: Expo Doctor
        env:
          EXPO_DOCTOR_ALLOW_NPX_DOWNLOAD: "1"
        run: npm run doctor:expo

      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Upload Cobertura coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-mobile-cobertura
          path: hermes-mobile/coverage/cobertura-coverage.xml
          if-no-files-found: error

      - name: Upload coverage to GitHub Code Quality
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: hermes-mobile/coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/hermes-mobile-jest
          fail-on-error: false

      - name: Export and scan public Android JavaScript
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          rm -rf "$RUNNER_TEMP/hermes-mobile-public-export"
          npx expo export --platform android --output-dir "$RUNNER_TEMP/hermes-mobile-public-export"
          npm run privacy:scan:artifact -- "$RUNNER_TEMP/hermes-mobile-public-export"

      - name: E2E flow validation (Maestro tier-0)
        run: npm run e2e:validate

      - name: Release safety contract
        run: npm run test:release-safety
