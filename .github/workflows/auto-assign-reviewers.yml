name: Auto-Assign Reviewers

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  assign_reviewers:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Analyze changes and assign reviewers
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // High-ROI: Smart reviewer assignment based on code ownership
            const changedFiles = context.payload.pull_request.changed_files;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get the file changes
            const files = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: context.payload.pull_request.number
            });
            
            // Owner-based mapping (customize for your team)
            const reviewerMap = {
              'src/components/': ['@codex', '@grok'],
              'src/screens/': ['@codex', '@helium'],
              'src/services/': ['@grok', '@ion'],
              'src/utils/': ['@igor'],
              '__tests__/': ['@igor', '@igor-team'],
              'hermes-mobile/src/': ['@igor', '@igor-mobile-team']
            };
            
            const recommendedReviewers = new Set();
            
            for (const { filename } of files.data) {
              for (const [pattern, reviewers] of Object.entries(reviewerMap)) {
                if (filename.startsWith(pattern)) {
                  reviewers.forEach(r => recommendedReviewers.add(r));
                }
              }
            }
            
            // GitHub 422s a review request naming the PR author, and every
            // agent-opened PR is authored by the repo owner — so the author
            // must be filtered out, and an empty result is success, not failure.
            const prAuthor = context.payload.pull_request.user.login.toLowerCase();
            const mapped = [...recommendedReviewers]
              .slice(0, 2) // Max 2 reviewers
              .map(r => r.replace('@', ''))
              .filter(r => r.toLowerCase() !== prAuthor);
            const fallback = ['igorganapolsky'].filter(r => r !== prAuthor);
            const toRequest = mapped.length > 0 ? mapped : fallback;

            if (toRequest.length === 0) {
              console.log('Only candidate reviewer is the PR author; nothing to assign.');
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: context.payload.pull_request.number,
                reviewers: toRequest
              });
              console.log(`Requested reviewers: ${toRequest.join(', ')}`);
            } catch (e) {
              // Reviewer assignment is advisory; a non-collaborator handle or
              // race must not fail the PR's checks.
              console.log(`Could not request reviewers (${toRequest.join(', ')}): ${e.message}`);
            }