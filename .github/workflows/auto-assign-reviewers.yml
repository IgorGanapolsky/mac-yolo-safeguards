name: Auto-Assign Reviewers

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  assign_reviewers:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Analyze changes and assign reviewers
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // High-ROI: Smart reviewer assignment based on code ownership
            const changedFiles = context.payload.pull_request.changed_files;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get the file changes
            const files = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: context.payload.pull_request.number
            });
            
            // Owner-based mapping (customize for your team)
            const reviewerMap = {
              'src/components/': ['@codex', '@grok'],
              'src/screens/': ['@codex', '@helium'],
              'src/services/': ['@grok', '@ion'],
              'src/utils/': ['@igor'],
              '__tests__/': ['@igor', '@igor-team'],
              'hermes-mobile/src/': ['@igor', '@igor-mobile-team']
            };
            
            const recommendedReviewers = new Set();
            
            for (const { filename } of files.data) {
              for (const [pattern, reviewers] of Object.entries(reviewerMap)) {
                if (filename.startsWith(pattern)) {
                  reviewers.forEach(r => recommendedReviewers.add(r));
                }
              }
            }
            
            // GitHub rejects a review request naming the PR author (422),
            // so the author must never appear in the final list.
            const author = context.payload.pull_request.user.login.toLowerCase();
            const reviewerArray = ([...recommendedReviewers].slice(0, 2).length > 0
              ? [...recommendedReviewers].slice(0, 2)
              : ['igorganapolsky'])
              .map(r => r.replace('@', ''))
              .filter(r => r.toLowerCase() !== author);

            if (reviewerArray.length === 0) {
              console.log(`No assignable reviewers (author ${author} excluded) — skipping`);
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: context.payload.pull_request.number,
                reviewers: reviewerArray
              });
              console.log(`Requested reviewers: ${reviewerArray.join(', ')}`);
            } catch (e) {
              // Reviewer assignment is best-effort advisory metadata; a 422
              // (non-collaborator or otherwise unassignable) must not fail CI.
              core.warning(`Could not request reviewers [${reviewerArray.join(', ')}]: ${e.message}`);
            }