name: Auto-Assign Reviewers

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  assign_reviewers:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Analyze changes and assign reviewers
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // High-ROI: Smart reviewer assignment based on code ownership
            const changedFiles = context.payload.pull_request.changed_files;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get the file changes
            const files = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: context.payload.pull_request.number
            });
            
            // Owner-based mapping (customize for your team)
            const reviewerMap = {
              'src/components/': ['@codex', '@grok'],
              'src/screens/': ['@codex', '@helium'],
              'src/services/': ['@grok', '@ion'],
              'src/utils/': ['@igor'],
              '__tests__/': ['@igor', '@igor-team'],
              'hermes-mobile/src/': ['@igor', '@igor-mobile-team']
            };
            
            const recommendedReviewers = new Set();
            
            for (const { filename } of files.data) {
              for (const [pattern, reviewers] of Object.entries(reviewerMap)) {
                if (filename.startsWith(pattern)) {
                  reviewers.forEach(r => recommendedReviewers.add(r));
                }
              }
            }
            
            // GitHub rejects a review request that includes the PR author with a hard
            // 422 ("Review cannot be requested from pull request author"), which fails
            // this whole check. Drop the author before asking.
            const author = context.payload.pull_request.user.login.toLowerCase();
            const DEFAULT_REVIEWER = 'igorganapolsky';

            const mapped = [...recommendedReviewers]
              .map(r => r.replace('@', ''))
              .filter(r => r.toLowerCase() !== author)
              .slice(0, 2); // Max 2 reviewers

            const reviewerArray = mapped.length > 0
              ? mapped
              : [DEFAULT_REVIEWER].filter(r => r.toLowerCase() !== author);

            if (reviewerArray.length === 0) {
              // Author is the only candidate — e.g. Igor opening a PR that touches no
              // mapped path. Nothing to request, and that is not a failure.
              console.log(`No reviewer to assign: author ${author} is the only candidate.`);
              return;
            }

            // A handle in reviewerMap that is not a repo collaborator also 422s. That is
            // a config problem, not a reason to fail the PR, so warn instead of throwing.
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: context.payload.pull_request.number,
                reviewers: reviewerArray
              });
              console.log(`Requested reviewers: ${reviewerArray.join(', ')}`);
            } catch (error) {
              if (error.status === 422) {
                core.warning(
                  `Could not request ${reviewerArray.join(', ')}: ${error.message}. ` +
                  `Check that each handle in reviewerMap is a collaborator on this repo.`
                );
              } else {
                throw error;
              }
            }