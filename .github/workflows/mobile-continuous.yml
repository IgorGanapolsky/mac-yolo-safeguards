name: Hermes Mobile Continuous

on:
  schedule:
    # Every 6 hours — autonomous cloud verification when Mac is offline
    - cron: '20 */6 * * *'
  pull_request:
    paths:
      - 'hermes-mobile/**'
      - '.github/workflows/mobile-continuous.yml'
  # Week-1 GitHub hardening: run contract jobs on merge-queue validation branches too.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# One global group starved the iOS e2e job: the 6-hourly cron held the lock for hours while
# PR runs queued behind it, and each new push cancelled the queued predecessor. Evidence
# 2026-07-27: six consecutive `pull_request` runs `cancelled`, one `pending` behind a
# 4-hour-old `schedule` run — so "Maestro ship-guard (macOS sim)" never reported on a PR.
# That is why the fatal iPad WatchdogTermination (Sentry APPS-3S) reached a device.
#
# PRs now get their own per-ref group (new push cancels only its own predecessor); the cron
# keeps a separate serialized group so scheduled verification still never overlaps itself.
concurrency:
  group: >-
    hermes-mobile-continuous-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || github.event_name == 'merge_group'
      && format('mq-{0}', github.ref)
      || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-and-contract:
    name: Unit + release safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Release safety contract
        run: npm run test:release-safety

  release-apk-guard:
    name: Release APK + embedded bundle
    runs-on: ubuntu-latest
    needs: unit-and-contract
    # ECONOMY 2026-07-28: full prebuild+assembleRelease is multi‑minute Ubuntu
    # per mobile PR under multi-agent thrash. Default PR path = unit+typecheck only.
    # APK guard still runs on schedule / merge_group / workflow_dispatch, or when
    # the PR has label `apk-guard`.
    if: >-
      github.event_name != 'pull_request'
      || contains(join(github.event.pull_request.labels.*.name, ','), 'apk-guard')
    defaults:
      run:
        working-directory: hermes-mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes-mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android (withEmbeddedJsBundle plugin)
        run: npx expo prebuild --platform android --non-interactive

      - name: Raise Gradle metaspace (prebuild regenerates gradle.properties)
        # Release APK builds OOM'd with "OutOfMemoryError: Metaspace" at the
        # Expo-default 512m. android/ is gitignored + regenerated by prebuild,
        # so override here (last key wins) instead of in the committed file.
        # Keep workers low on GitHub's 7GB Linux runner; parallel Kotlin JVMs
        # have repeatedly exhausted metaspace before APK verification can run.
        run: |
          {
            echo 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8'
            echo 'org.gradle.workers.max=1'
            echo 'org.gradle.parallel=false'
            echo 'kotlin.compiler.execution.strategy=in-process'
            echo 'kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m'
          } >> android/gradle.properties

      - name: Assert debuggableVariants guard in generated Gradle
        run: grep -F 'debuggableVariants = []' android/app/build.gradle

      - name: Build release APK
        env:
          # No SENTRY_AUTH_TOKEN in CI — skip native sourcemap upload (T-121 / PR #71).
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          SENTRY_ALLOW_FAILURE: "true"
        run: cd android && ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=1 -PreactNativeArchitectures=arm64-v8a

      - name: Verify embedded JS bundle
        run: node scripts/verify-apk-package.cjs android/app/build/outputs/apk/release/app-release.apk

  macos-maestro-smoke:
    name: Maestro ship-guard (macOS sim)
    # Expo SDK 55's iOS native modules require Xcode 26; pin the runner so
    # the simulator smoke does not drift onto older Xcode 15/16 images.
    #
    # TRIGGER SCOPE — measured 2026-07-29, not assumed.
    #
    # Why it must NOT run on every PR (35 executed job instances before the gate landed):
    #   2 success / 20 failure / 13 cancelled  →  5.7% success rate
    #   Duration 8–35 min, `timeout-minutes: 45`.
    # The failures were NOT infra flake: job 90138078085 shows a real, repeatable
    # `Assertion is false: id: chat-screen-header is visible` inside recover-chat-tab.yaml
    # after ~90 s of retries on the hosted iOS simulator. A non-required check that is
    # legitimately red on ~everything, for 35 min, on every PR, is pure noise — it trains
    # reviewers to ignore check status and it delays the checks that DO gate merge.
    #
    # Correcting two claims that were previously used to justify this gate:
    #   - This repo is PUBLIC, so GitHub-hosted runner minutes are FREE. The earlier
    #     "burning 90% of 3k free minutes" rationale did not apply to this job.
    #   - This job is `runs-on: macos-26` (GitHub-hosted). It has never consumed Igor's
    #     self-hosted Macs, so it cannot have starved the required `macOS guard kit`
    #     (which uses `macos-latest` on pull_request) or the reserved `ipad-simulator`
    #     runner. The real cost is reviewer attention and wall-clock, not minutes.
    #
    # Why it MUST still run somewhere: gating it to `workflow_dispatch` + PR label alone
    # silently deleted ALL automated iOS-simulator ship-guard coverage — `schedule` was
    # excluded too, so nothing was left to catch the recover-chat-tab regression above.
    # It is therefore restored on the 6-hourly cron: free on a public repo, blocks no PR,
    # and fails loudly where a human is not waiting on it.
    #
    # Deliberately NOT added to `merge_group`: this job is currently red for a real
    # product reason, and adding it there would block every merge on a non-required check.
    # Required branch check remains "Maestro ship-guard (Android emulator)", not this job.
    # Local continuous E2E LaunchAgent remains the day-to-day dogfood path.
    runs-on: macos-26
    needs: unit-and-contract
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || (github.event_name == 'pull_request'
          && contains(join(github.event.pull_request.labels.*.name, ','), 'macos-e2e'))
    timeout-minutes: 45
    defaults:
      run:
        working-directory: hermes-mobile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Java 17
        run: brew install openjdk@17

      - name: Install Maestro
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Maestro ship-guard on iOS simulator
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
          JAVA_HOME: /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_ALLOW_FAILURE: 'true'
        run: |
          export PATH="$JAVA_HOME/bin:$HOME/.maestro/bin:$PATH"
          bash ./scripts/run-simulator-e2e.sh .maestro/ship-guard.yaml
