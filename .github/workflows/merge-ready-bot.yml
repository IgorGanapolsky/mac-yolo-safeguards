name: Merge-Ready Bot

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: merge-ready-bot-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  check_merge_readiness:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check PR merge readiness
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // High-ROI: Automate merge readiness verification
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            for (const pr of pulls) {
              const latestRun = context.payload.workflow_run 
                ? await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: context.payload.workflow_run.id
                  })
                : null;

              // Get PR details
              const { data: prDetails } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });

              // Get checks for this PR
              const { data: commits } = await github.rest.pulls.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });

              const headSha = commits[commits.length - 1]?.sha;
              if (!headSha) continue;

              // Get latest commit status
              const { data: commitStatus } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha
              });

              // Check if PR is ready to merge
              const isReady = prDetails.mergeable_state === 'clean';
              const hasRequiredLabels = prDetails.labels.some(label => 
                label.name.startsWith('status:') || label.name.startsWith('size:')
              );

              if (isReady && hasRequiredLabels) {
                // Add ready-to-merge label
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: ['status:ready-to-merge']
                  });
                  
                  // Post comment
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: `✅ **Merge Ready**\n\nThis PR is ready to merge! All checks passed. Estimated merge time: ~ \`git push && gh pr merge --auto --squash\``
                  });
                  
                  console.log(`PR #${pr.number} is ready to merge`);
                } catch (err) {
                  console.log(`Could not update PR #${pr.number}: ${err.message}`);
                }
              }
            }