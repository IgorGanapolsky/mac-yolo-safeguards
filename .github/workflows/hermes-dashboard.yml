name: Hermes web dashboard

concurrency:
  group: hermes-dashboard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "apps/hermes-dashboard/**"
      - "packages/hermes-protocol/**"
      - ".github/workflows/hermes-dashboard.yml"
  push:
    branches: [main]
    paths:
      - "apps/hermes-dashboard/**"
      - "packages/hermes-protocol/**"
      - ".github/workflows/hermes-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: hermes-dashboard-${{ github.ref }}
  cancel-in-progress: true


jobs:
  protocol-and-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/hermes-protocol/package-lock.json
            apps/hermes-dashboard/package-lock.json
      - name: Install protocol dependencies
        working-directory: packages/hermes-protocol
        run: npm ci
      - name: Verify protocol coverage and E2E
        working-directory: packages/hermes-protocol
        run: npm run ci
      - name: Install dashboard dependencies
        working-directory: apps/hermes-dashboard
        run: npm ci
      - name: Verify dashboard coverage
        working-directory: apps/hermes-dashboard
        run: npm run test:coverage
      - name: Cache Playwright browsers
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-dashboard-${{ hashFiles('apps/hermes-dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-dashboard-
      - name: Install browser
        working-directory: apps/hermes-dashboard
        run: npx playwright install --with-deps chromium
      - name: Verify dashboard browser E2E
        working-directory: apps/hermes-dashboard
        run: npm run test:e2e
