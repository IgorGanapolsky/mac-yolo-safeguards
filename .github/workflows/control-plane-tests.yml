name: control-plane-tests

on:
  pull_request:
    paths:
      - "apps/hermes-control-plane/**"
      - ".github/workflows/control-plane-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/hermes-control-plane/**"

permissions:
  contents: read

concurrency:
  group: control-plane-tests-${{ github.ref }}
  cancel-in-progress: true


jobs:
  unit-and-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/hermes-control-plane
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/hermes-control-plane/package-lock.json
      - run: npm ci
      - name: Unit tests with coverage gates (80% lines/functions, 70% branches)
        run: npm run test:unit
      - name: Build + rendered-HTML tests
        run: npm run test
