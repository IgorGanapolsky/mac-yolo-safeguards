# Federated skill sources (AMD skills catalog pattern).
# Pin external skills by tag or commit — never bare main in production agents.
# Import is manual; this file is the pin ledger + discovery surface.

version: 1
catalog: mac-yolo-safeguards
updated: 2026-08-13
notes: >
  High-ROI steal from https://github.com/amd/skills federation (sources.yml).
  In-repo skills live under .agents/skills/*/ and are validated by
  tools/skill-card-validate.js. External pins below are optional installs.

in_repo:
  - anti-babysitting
  - browseros-agent-harness
  - ci-pr-monitor
  - garryslist-opportunity-tracker
  - gurobi-optimizer-integrator
  - hybrid-route-policy
  - linear-agent-skills
  - local-media-lane
  - live-dashboard-verify
  - revenue-gap-tracker
  - skill-catalog-governance
  - cloudflare-developer-stack
  - knowledge-layer-edges-not-gremlin


external:
