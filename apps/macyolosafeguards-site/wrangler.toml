# Custom domains (macyolosafeguards.io, www) are attached in the Cloudflare dashboard; deploy leaves them as they are.
name = "macyolosafeguards"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
# Let the Worker see "/" first so Accept: text/markdown negotiation runs before the static index.html.
run_worker_first = ["/", "/index.html"]

# Unpaid-checkout alerts (src/checkout-alerts.js). Production only; staging uses test-mode Stripe.
[triggers]
crons = ["*/30 * * * *"]

# Staging copy for end-to-end license tests against Stripe test mode, on workers.dev only.
# Secrets: STRIPE_RESTRICTED_KEY (a test-mode key), LICENSE_SIGNING_KEY (a test key pair).
# Vars below point it at the test-mode Pro payment link and the matching public key.
[env.staging]
workers_dev = true
# Staging must never run the production cron or send to a live checkout:
# with CHECKOUT_MODE = "test", /go/* only follows a test-mode PRO_CHECKOUT_URL var.
triggers = { crons = [] }

[env.staging.vars]
CHECKOUT_MODE = "test"
